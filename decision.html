        <h1>Ask The Potato</h1>
        <h2>You have a problem. The potato has the answer.</h2>
        <p>(Just yes and no. Maybe also maybe.)</p>
        <input type="text" id="question" placeholder="What would you like to ask the potato?">
        <button onclick="askPotato()" class="potato-button" id="potato-button" disabled>
            <img src="potato.png" alt>
        </button>
        <p id="potato-answer"></p>

        <script>
            function askPotato() {
                let answer = [
                    "Yes.",
                    "No.",
                    "Absolutely not.",
                    "The potato says yes.",
                    "Ask again later.",
                    "I have no idea.",
                    "Probably.",
                    "This seems like a you problem.",
                    "Maybe. Maybe not. Who knows?",
                    "The potato refuses to answer.",
                    "The potato has left the chat.",
                    "The vibes say yes.",
                    "The vibes say absolutely not.",
                    "Why are you asking a potato?"
                ];
                let randomIndex = Math.floor(Math.random() * answer.length);
                document.getElementById("potato-answer").textContent = answer[randomIndex];
            }
            let question = document.getElementById("question");
            let potatoButton = document.getElementById("potato-button");
            question.addEventListener("input", function() {
                if (question.value.trim() !== "") {
                    potatoButton.disabled = false;
                } else {
                    potatoButton.disabled = true;
                }
            });
        </script>
    </body>
