        <h1>Behind This Door</h1>
        <p>There is absolutely no reason to open this door</p>
        <div class="door" onclick="openDoor()">
            <div class="doorknob"></div>
        </div>
        <p id="door-message"></p>

        <script>
            let messages = [
                "Congratulations. You opened a door. There was nothing behind it.",
                "Wow. A door. Revolutionary.",
                "You opened it. Are you happy now?",
                "There is absolutely nothing here.",
                "You have wasted several seconds of your life.",
                "Door opened successfully. Purpose: unknown.",
                "That was probably not worth it.",
                "You expected treasure, didn't you?",
                "Please close the door. This is embarrassing."
            ];
            function openDoor() {
                let door = document.querySelector(".door");

                if (door.classList.contains("open")) {
                    door.classList.remove("open");
                    document.getElementById("door-message").textContent =
                        "You closed the door. Probably for the best.";
                } else {
                    door.classList.add("open");

                    let randomIndex = Math.floor(Math.random() * messages.length);

                    document.getElementById("door-message").textContent = messages[randomIndex];
                }
            }
        </script>
