        <img src="pigeon.jpg" alt="A pigeon staring into your soul">
        <h1>The Pigeon Knows</h1>
        <p>
            Feed your last two brain cells some completely unnecessary knowledge.
        </p>
        <button class="btn btn-danger" onclick="showFact()">
            What Does the Pigeon Know?
        </button>
        <p id="fact"></p>

        <script>
            let facts = [
                "Water is wet.",
                "Goats have rectangular pupils.",
                "Scotland's national animal is the unicorn.",
                "Your left hand and your right hand are on different sides of your body.",
                "An octopus has blue blood.",
                "Your brain named itself 'brain' and then made you read this.",
                "Goats can have accents.",
                "Some cats are allergic to humans.",
                "Every 'i' in the word 'Hawaii' has a dot.",
                "Bananas are botanically berries, but strawberries aren't.",
            ];
            function showFact() {
                let randomIndex = Math.floor(Math.random() * facts.length);
                document.getElementById("fact").textContent = facts[randomIndex];
            }
        </script>
    </body>
